<div class="l-center l-center__total">
  <div class="card">
    <div class="card__image">
      <img src="assets/{{ servicio.pictureUrl }}.jpg" />
    </div>
    <div class="card__content">
      <h5 class="card__title">{{ servicio.name }}</h5>
      <p class="card__description">{{ servicio.description }}</p>
      <p class="card__price">{{ servicio.price }}€</p>
    </div>
    <button class="card__button" routerLink="/servicios">Volver</button>
  </div>
</div>
