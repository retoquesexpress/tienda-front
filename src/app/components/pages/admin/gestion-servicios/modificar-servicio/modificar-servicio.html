<div class="formulario">
  <h2 class="formulario__title">Modifica Tu Servicio</h2>
  <form class="formulario__form" (ngSubmit)="putServicio()" #myForm="ngForm">
    <input class="formulario__form-input" type="text" id="nombre" name="nombre" [(ngModel)]="servicio.name" placeholder="Nombre">
    <input class="formulario__form-input" type="text" id="descripcion" name="descripcion" [(ngModel)]="servicio.description" placeholder="Descripción">
    <input class="formulario__form-input" type="number" id="precio" name="precio" [(ngModel)]="servicio.price" placeholder="Precio">
    <input class="formulario__form-input" type="text" id="pictureUrl" name="pictureUrl" [(ngModel)]="servicio.pictureUrl" placeholder="URL de la imagen">
    <input class="formulario__form-input" type="text" id="idCategoria" name="idCategoria" [(ngModel)]="servicio.category.id_category" placeholder="ID Categoría">
    <input class="formulario__form-input" type="text" id="nombreCategoria" name="nombreCategoria" [(ngModel)]="servicio.category.name" placeholder="Nombre Categoría">
    <button class="formulario__form-button" type="submit">Modificar</button>
    <button class="formulario__form-button formulario__form-button--volver" type="button" routerLink="/servicios">Volver</button>

  </form>
</div>
