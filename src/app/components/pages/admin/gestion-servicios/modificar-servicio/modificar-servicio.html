<div class="l-center l-center__total g--margin-top-100">
  <div class="formulario formulario--edit">
    <header class="formulario__header">
      <h2 class="formulario__title">Edición de Servicio</h2>
      <div class="formulario__id-badge">ID: {{ servicio.idService }}</div>
    </header>

    <form class="formulario__form" (ngSubmit)="putServicio()" #myForm="ngForm">
      
      <div class="formulario__main-grid">
        <div class="formulario__fields">
          <div class="formulario__field-group">
            <label class="formulario__label">Nombre del Servicio</label>
            <input class="formulario__input" type="text" name="nombre" [(ngModel)]="servicio.name" placeholder="Ej. Corte de pelo">
          </div>

          <div class="formulario__field-group">
            <label class="formulario__label">Descripción</label>
            <textarea class="formulario__input formulario__input--textarea" name="description" [(ngModel)]="servicio.description"></textarea>
          </div>

          <div class="formulario__row">
            <div class="formulario__field-group">
              <label class="formulario__label">Precio (€)</label>
              <input class="formulario__input" type="number" name="precio" [(ngModel)]="servicio.price">
            </div>
            <div class="formulario__field-group">
              <label class="formulario__label">URL Imagen</label>
              <input class="formulario__input" type="text" name="pictureUrl" [(ngModel)]="servicio.pictureUrl">
            </div>
          </div>
        </div>
      </div>

      <fieldset class="formulario__fieldset">
        <legend class="formulario__legend">Clasificación</legend>
        <div class="formulario__row">
          <input class="formulario__input formulario__input--id" type="text" name="idCategory" [(ngModel)]="servicio.category.idCategory" placeholder="ID">
          <input class="formulario__input" type="text" name="nombreCategoria" [(ngModel)]="servicio.category.name" placeholder="Nombre Categoría">
        </div>
      </fieldset>

      <footer class="formulario__actions">
        <button class="formulario__btn formulario__btn--save" type="submit">Guardar Cambios</button>
        <button class="formulario__btn formulario__btn--cancel" type="button" routerLink="/servicios">Cancelar</button>
      </footer>
    </form>
  </div>
</div>
