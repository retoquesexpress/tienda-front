<div>
  <h1 class="l-center l-center__horizontal g--font-family-titulos">Listado de servicios</h1>
  <div class="servicios">
    <table class="servicios__table">
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th>Precio</th>
        <th>Categoria</th>
        <th>
          Gestión
          <button class="servicios__button servicios__button--green g--font-family-titulos" routerLink="/nuevo">
            Añadir Servicio
          </button>
        </th>
      </tr>
      <tbody>
        @for (servicio of servicios; track servicio.idService){
        <tr>
          <td>{{ servicio.idService }}</td>
          <td>{{ servicio.name }}</td>
          <td>{{ servicio.description }}</td>
          <td>{{ servicio.price }}€</td>
          <td>{{ servicio.category.name}}</td>
          <td>
            <button class="servicios__button servicios__button--blue" routerLink="/visualizar/{{ servicio.idService }}">
              Ver
            </button>
            <button class="servicios__button servicios__button--red" (click)="funcionEliminar(servicio.idService)">
              Borrar
            </button>
            <button class="servicios__button servicios__button--yellow"
              routerLink="/modificar/{{ servicio.idService }}">
              Modificar
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
