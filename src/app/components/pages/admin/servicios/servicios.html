<div>
  <h1 class="l-center l-center__horizontal">Listado de servicios</h1>
  <div class="servicios">
    <table class="servicios__table">
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th>Precio</th>
        <th>
          Gestión
          <button class="servicios__button servicios__button--green" routerLink="/nuevo">
            Añadir Servicio
          </button>
        </th>
      </tr>
      <tbody>
        @for (servicio of servicios; track servicio.id){
        <tr>
          <td>{{ servicio.id }}</td>
          <td>{{ servicio.nombre }}</td>
          <td>{{ servicio.descripcion }}</td>
          <td>{{ servicio.precio }}€</td>
          <td>
            <button
              class="servicios__button servicios__button--blue"
              routerLink="/visualizar/{{ servicio.id }}"
            >
              Ver
            </button>
            <button
              class="servicios__button servicios__button--red"
              (click)="funcionEliminar(servicio.id)"
            >
              Borrar
            </button>
            <button 
              class="servicios__button servicios__button--yellow"
              routerLink="/modificar/{{ servicio.id }}"
            >
              Modificar
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
